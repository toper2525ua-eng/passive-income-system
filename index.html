<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Passive Income System</title>
    <meta name="description" content="Система пасивного доходу: торгові боти, інструкції, закритий канал." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-orb bg-orb--a"></div>
    <div class="bg-orb bg-orb--b"></div>

    <div class="app">

      <!-- ── Header ── -->
      <header class="app-header">
        <div class="brand">
          <span class="brand__mark">PI</span>
          <div class="brand__text">
            <strong>Passive Income System</strong>
          </div>
        </div>
        <span class="online-badge">● online</span>
      </header>

      <!-- ── Main ── -->
      <main class="app-main">

        <!-- Tab: Система -->
        <div class="tab-panel is-active" id="panel-bot">
          <div class="panel-top">
            <div class="progress-mini">
              <span id="progressText">Екран 1 з 9</span>
              <div class="progress-track"><span id="progressFill"></span></div>
            </div>
            <div class="pills-scroll">
              <div class="pills" id="quickActions" role="navigation" aria-label="Розділи"></div>
            </div>
          </div>

          <div class="panel-content">
            <article class="screen-card">
              <div class="screen-content" id="screenContent"></div>
            </article>
          </div>

          <div class="panel-footer">
            <button class="btn btn--ghost btn--sm" id="prevButton" type="button">← Назад</button>
            <button class="btn btn--ghost btn--sm" id="nextButton" type="button">Далі →</button>
          </div>
        </div>

        <!-- Tab: FAQ -->
        <div class="tab-panel" id="panel-faq">
          <div class="panel-content">
            <article class="screen-card">
              <div class="screen-content" id="faqContent"></div>
            </article>
          </div>
          <div class="panel-footer">
            <a class="btn btn--ghost btn--sm" data-link="telegram" href="#">Поставити питання</a>
          </div>
        </div>

        <!-- Tab: Доступ -->
        <div class="tab-panel" id="panel-access">
          <div class="panel-content">
            <article class="screen-card">
              <div class="screen-content" id="accessContent"></div>
            </article>
          </div>
          <div class="panel-footer panel-footer--cta">
            <div class="cta-info">
              <strong>100$ одноразово</strong>
              <small>канал, боти, інструкції, оновлення</small>
            </div>
            <a class="btn btn--primary" data-link="payment" href="#">Отримати доступ</a>
          </div>
        </div>

      </main>

      <!-- ── Bottom Nav ── -->
      <nav class="bottom-nav">
        <button class="nav-item is-active" data-tab="bot" type="button">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="4"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/><path d="M9 14s1 1 3 1 3-1 3-1"/>
          </svg>
          <span>Система</span>
        </button>
        <button class="nav-item" data-tab="faq" type="button">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          <span>FAQ</span>
        </button>
        <button class="nav-item" data-tab="access" type="button">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <span>Доступ</span>
        </button>
      </nav>

    </div>

    <script src="script.js"></script>
  </body>
</html>
